[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "resonance-conversation"
version = "0.1.0"
description = "Conversation brain and local real-time voice service for Resonance Chemistry Calls"
requires-python = ">=3.11"
dependencies = [
  "argon2-cffi>=23,<26",
  "asyncpg>=0.29,<1",
  "fastapi>=0.115,<1",
  "pyjwt>=2.8,<3",
  "langgraph>=0.2,<2",
  "pydantic>=2.8,<3",
  "python-dotenv>=1,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
voice = [
  "pipecat-ai[livekit,whisper,piper,google,sarvam]>=0.0.108,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
